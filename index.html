<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>EKG & ACS Simulator (Pro)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="app-body">
    <!-- Pop-up ประเมินผลการรักษา -->
    <div id="feedback-modal" onclick="closePopup()">
        <div class="modal-content" id="modal-box" onclick="event.stopPropagation()">
            <div class="modal-icon" id="modal-icon">✅</div>
            <h3 id="modal-title" style="margin-top:0;">ยอดเยี่ยม!</h3>
            <p id="modal-msg" style="font-size: 15px; color: #555;">คำอธิบาย...</p>
            <button class="btn-blue" onclick="closePopup()" style="margin-top:15px; width:100%">รับทราบ</button>
        </div>
    </div>

    <div class="app-container">
        <!-- แผงควบคุมสำหรับ Instructor -->
        <div id="instructor-panel" class="panel blue-accent">
            <h3 class="panel-title">Instructor Control</h3>
            <label>โหมดเครื่อง: 
                <select id="machine-mode" onchange="toggleMachine()">
                    <option value="12lead">Nihon 12-Lead EKG</option>
                    <option value="defib">Zoll R Series Defib</option>
                </select>
            </label>
            <hr>
            <label>HR: <input type="number" id="hr-input" value="80" max="300" oninput="updateSummary()"></label>
            <label>BP: <input type="text" id="bp-input" value="120/80" oninput="updateSummary()"></label>
            <label>Rhythm: 
                <select id="rhythm-select" onchange="updateSummary()">
                    <option value="nsr">Normal Sinus</option>
                    <option value="af">Atrial Fibrillation (AF)</option>
                    <option value="aflutter">Atrial Flutter</option>
                    <option value="svt">SVT</option>
                    <option value="1st-avb">1st Degree AV Block</option>
                    <option value="2nd-avb-1">2nd Degree AV Block (Type I)</option>
                    <option value="2nd-avb-2">2nd Degree AV Block (Type II)</option>
                    <option value="3rd-avb">3rd Degree AV Block</option>
                    <option value="st-elev">ST Elevation</option>
                    <option value="st-dep">ST Depression</option>
                    <option value="t-inv">T Invert</option>
                    <option value="peak-t">Tall Peak T</option>
                    <option value="tdp">Torsades de Pointes</option>
                    <option value="vf">VF</option>
                    <option value="vt">VT (Pulseless)</option>
                    <option value="asystole">Asystole</option>
                    <option value="pea">PEA</option>
                </select>
            </label>
            
            <label>Lead ผิดปกติ: 
                <select id="lead-defect-mode" onchange="updateLeadDefectUI(); updateSummary();">
                    <option value="ALL">ทั้งหมด (All Leads)</option>
                    <option value="INFERIOR">Inferior (II, III, aVF)</option>
                    <option value="ANTERIOR">Anterior (V1-V4)</option>
                    <option value="LATERAL">Lateral (I, aVL, V5, V6)</option>
                    <option value="CUSTOM">ระบุเอง (Custom Checkbox)</option>
                </select>
            </label>
            <div id="custom-lead-selector" style="display:none; grid-template-columns: repeat(4, 1fr); gap: 5px; font-size:12px; margin-top:5px; background: #e1e8ed; padding: 8px; border-radius: 4px;">
                <label><input type="checkbox" value="I" onchange="updateSummary()"> I</label>
                <label><input type="checkbox" value="aVR" onchange="updateSummary()"> aVR</label>
                <label><input type="checkbox" value="V1" onchange="updateSummary()"> V1</label>
                <label><input type="checkbox" value="V4" onchange="updateSummary()"> V4</label>
                
                <label><input type="checkbox" value="II" onchange="updateSummary()"> II</label>
                <label><input type="checkbox" value="aVL" onchange="updateSummary()"> aVL</label>
                <label><input type="checkbox" value="V2" onchange="updateSummary()"> V2</label>
                <label><input type="checkbox" value="V5" onchange="updateSummary()"> V5</label>
                
                <label><input type="checkbox" value="III" onchange="updateSummary()"> III</label>
                <label><input type="checkbox" value="aVF" onchange="updateSummary()"> aVF</label>
                <label><input type="checkbox" value="V3" onchange="updateSummary()"> V3</label>
                <label><input type="checkbox" value="V6" onchange="updateSummary()"> V6</label>
            </div>
            
            <h4 style="margin-top: 15px;">Unstable Signs</h4>
            <div class="checkbox-group">
                <label><input type="checkbox" id="sign-loc" onchange="updateSummary()"> Alteration of conscious</label><br>
                <label><input type="checkbox" id="sign-hf" onchange="updateSummary()"> Sign of Heart Failure</label><br>
                <label><input type="checkbox" id="sign-cp" onchange="updateSummary()"> Chest Pain</label><br>
                <label><input type="checkbox" id="sign-hypo" onchange="updateSummary()"> Hypotension</label><br>
                <label><input type="checkbox" id="sign-shock" onchange="updateSummary()"> Signs of Shock</label>
            </div>
        </div>

        <!-- หน้าจอ Monitor -->
        <div id="center-display">
            <div id="patient-summary" class="panel">
                <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #e1e8ed; padding-bottom: 5px; margin-bottom: 5px;">
                    <h4 style="margin: 0; color: #005bb5;">📋 สรุปอาการผู้ป่วย (Patient Summary)</h4>
                    <button class="btn-blue btn-small" onclick="exportEKG()">📸 บันทึก EKG (PNG)</button>
                </div>
                <div id="summary-content">กำลังโหลดข้อมูล...</div>
            </div>

            <!-- มอนิเตอร์ EKG -->
            <div id="monitor-display">
                <div id="zoll-header" style="display:none;">ZOLL R Series</div>
                <canvas id="ekg-canvas"></canvas>
                <div id="vitals-display">
                    <div class="vital-box">HR <span id="display-hr">80</span></div>
                    <div class="vital-box">BP <span id="display-bp">120/80</span></div>
                    <div id="sync-status" style="display:none; color: yellow;">SYNC</div>
                </div>
                <button id="fullscreen-btn" onclick="toggleFullScreen()">⛶ เต็มจอ</button>
            </div>
        </div>

        <!-- แผงควบคุมผู้เรียน -->
        <div id="student-panel" class="panel blue-accent">
            <div id="defib-controls" style="display: none;">
                <h3 class="panel-title">Zoll Controls</h3>
                <div class="mode-buttons">
                    <button class="btn-blue" onclick="setDefibMode('monitor')">Monitor</button>
                    <button class="btn-blue" onclick="setDefibMode('defib')">Defib</button>
                    <button class="btn-blue" onclick="setDefibMode('pace')">Pace</button>
                </div>
                
                <div id="defib-sub-panel" class="control-box" style="display:none;">
                    <button class="btn-blue" onclick="toggleSync()" id="btn-sync" style="width:100%">Sync / Async</button>
                    <div style="margin: 15px 0;">
                        <label>Energy (J): <input type="number" id="energy-select" min="50" max="300" step="10" value="200"></label>
                    </div>
                    <div style="text-align: center;">
                        <!-- การกดช็อกจะส่งประเมินผลไปยังฟังก์ชัน evaluateTreatment -->
                        <button id="btn-shock" onmousedown="startShock()" onmouseup="cancelShock()" class="shock-btn">SHOCK</button>
                    </div>
                    <div id="shock-progress" style="display:none; color:#d93025; font-weight:bold; text-align:center; margin-top:10px;">Charging... Hold button!</div>
                </div>

                <div id="pace-sub-panel" class="control-box" style="display:none;">
                    <select id="pace-mode" class="input-full"><option>Demand</option><option>FIX</option></select>
                    <div style="margin-top:10px;">
                        <label>Rate: <input type="number" id="pace-rate" value="70"></label><br>
                        <label>Output: <input type="number" id="pace-ma" value="0"> mA</label>
                    </div>
                    <!-- ปุ่มเริ่ม Pacing เพื่อประเมิน Capture -->
                    <button class="btn-blue full-width" style="margin-top: 10px; background: #0f9d58;" onclick="evaluateTreatment('Pace')">Start Pacing</button>
                </div>
            </div>

            <!-- การรักษา -->
            <div id="interventions" style="margin-top: 20px;">
                <h3 class="panel-title">Action & Meds</h3>
                <button class="btn-blue full-width" style="background:#444;" onclick="evaluateTreatment('Observe')">👁️ สังเกตอาการ (Observe)</button>
                <button class="btn-blue full-width" style="background:#d93025;" onclick="evaluateTreatment('CPR')">🩸 CPR 2 mins</button>
                <button class="btn-blue full-width" onclick="evaluateTreatment('Adrenaline')">Adrenaline</button>
                <button class="btn-blue full-width" onclick="evaluateTreatment('Amiodarone')">Amiodarone</button>
                <button class="btn-blue full-width" onclick="evaluateTreatment('Adenosine')">Adenosine</button>
                <button class="btn-blue full-width" onclick="evaluateTreatment('Atropine')">Atropine</button>
                <button class="btn-blue full-width" onclick="evaluateTreatment('Dopamine')">Dopamine</button>
                <button class="btn-blue full-width" onclick="evaluateTreatment('Levophed')">Levophed</button>
                <button class="btn-blue full-width" onclick="evaluateTreatment('Xylocaine')">Xylocaine</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
